# render.yaml
services:
  - type: web
    name: email-categorization-system
    runtime: python
    repo: https://github.com/HarshS1120/email-categorization-system
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install setuptools==68.2.2 wheel==0.41.2
      pip install pandas==2.0.3 numpy==1.24.3
      pip install scikit-learn==1.3.0 nltk==3.8.1
      pip install streamlit==1.28.1
      python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt')"
      python main.py
    startCommand: streamlit run app.py --server.port 10000 --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIP_DEFAULT_TIMEOUT
        value: 100