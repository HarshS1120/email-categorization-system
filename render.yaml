# render.yaml
services:
  - type: web
    name: email-categorization-system
    runtime: python
    repo: https://github.com/HarshS1120/email-categorization-system
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /
    buildCommand: |
      pip install -r requirements.txt
      python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt')"
    startCommand: streamlit run app.py --server.port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0